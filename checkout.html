<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMINO STUDIO | Checkout Preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="floating-decor" aria-hidden="true">
  <span>🍑</span><span>♡</span><span>🍑</span><span>♡</span><span>🍑</span>
  <span>♡</span><span>🍑</span><span>♡</span>
</div>

<header class="mini-header">
  <a href="index.html">← Back to Pricelist</a>
  <img src="logo.png" alt="AMINO STUDIO">
  <span></span>
</header>

<main class="checkout-wrap">
  <div class="checkout-head">
    <div class="pill">AMINO STUDIO</div>
    <h1>Checkout Preview 🍑</h1>
    <p>This is a visual checkout layout. Payment and transaction submission are not enabled here.</p>
  </div>

  <section class="checkout-grid">
    <div class="checkout-card">
      <h2>Customer Details</h2>
      <label>Name<input placeholder="Your name" disabled></label>
      <label>Telegram username<input placeholder="@username" disabled></label>
      <label>Contact number<input placeholder="09xx xxx xxxx" disabled></label>
      <label>Shipping address<textarea placeholder="Your shipping address" disabled></textarea></label>
    </div>

    <div class="checkout-card summary">
      <h2>Order Summary</h2>
      <div class="summary-row"><span>Selected items</span><b>—</b></div>
      <div class="summary-row"><span>Subtotal</span><b>—</b></div>
      <div class="summary-row"><span>Admin fee</span><b>—</b></div>
      <div class="summary-row total"><span>Total</span><b>—</b></div>
      <button disabled>CHECKOUT — NOT ENABLED</button>
      <small>This page is a design preview only.</small>
    </div>
  </section>
</main>
<footer>★ AMINO STUDIO ★</footer>
</body>
</html>
